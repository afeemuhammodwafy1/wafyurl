<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Protected Link - wafyurl</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/favicon.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .password-container {
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
        }
        .password-container .lock-icon {
            font-size: 3rem;
            color: var(--neon-blue);
            margin-bottom: 1rem;
        }
        .password-container h2 {
            margin-bottom: 0.5rem;
        }
        .password-container p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }
        .password-input-group {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }
        .password-input-group input {
            padding: 14px 18px;
            border-radius: 12px;
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: var(--transition);
        }
        .password-input-group input:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-glow);
        }
        .password-error {
            color: var(--error);
            font-size: 0.9rem;
            margin-top: 0.5rem;
            min-height: 1.5rem;
        }
        .btn-unlock {
            width: 100%;
            padding: 14px;
            background: var(--neon-blue);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-unlock:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--neon-glow-strong);
        }
        .btn-unlock:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="container">
        <div class="card password-container">
            <div class="lock-icon">🔒</div>
            <h2>Password Protected</h2>
            <p>This link is protected with a password. Enter the password to continue.</p>
            
            <div class="password-input-group">
                <input 
                    type="password" 
                    id="passwordInput" 
                    placeholder="Enter password..." 
                    autofocus
                >
                <button id="unlockBtn" class="btn-unlock">
                    <i class="fas fa-unlock"></i> Unlock Link
                </button>
                <div id="passwordError" class="password-error"></div>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('unlockBtn').addEventListener('click', async function() {
            const code = window.location.pathname.split('/').pop();
            const password = document.getElementById('passwordInput').value;
            const errorEl = document.getElementById('passwordError');
            
            if (!password) {
                errorEl.textContent = 'Please enter the password.';
                return;
            }
            
            this.disabled = true;
            this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
            
            try {
                const response = await fetch('/verify-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = data.url;
                } else {
                    errorEl.textContent = data.error || 'Incorrect password.';
                    this.disabled = false;
                    this.innerHTML = '<i class="fas fa-unlock"></i> Unlock Link';
                }
            } catch {
                errorEl.textContent = 'Network error. Please try again.';
                this.disabled = false;
                this.innerHTML = '<i class="fas fa-unlock"></i> Unlock Link';
            }
        });
        
        document.getElementById('passwordInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('unlockBtn').click();
            }
        });
    </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password-protected link | WafyURL</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f8faff">
  <link rel="icon" type="image/webp" href="/icon.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    .password-layout { display: grid; place-items: center; min-height: calc(100vh - 170px); padding: 40px 16px; }
    .password-card { width: min(440px, 100%); padding: 34px; border: 1px solid var(--border); border-radius: 18px; background: #fff; box-shadow: var(--shadow-card); }
    .password-lock { display: grid; place-items: center; width: 50px; height: 50px; margin-bottom: 20px; border-radius: 15px; background: var(--indigo-soft); color: var(--indigo); font-size: 19px; }
    .password-card h1 { margin: 0; font-size: 25px; letter-spacing: -.8px; }
    .password-card > p { margin: 9px 0 23px; color: var(--muted); font-size: 12px; line-height: 1.8; }
    .password-field { display: flex; gap: 8px; }
    .password-field input { width: 100%; min-width: 0; height: 45px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 10px; outline: 0; }
    .password-field input:focus { border-color: #818cf8; box-shadow: var(--focus); }
    .password-field button { flex: 0 0 auto; }
    .password-error { min-height: 22px; margin: 8px 0 0; color: var(--danger); font-size: 11px; }
    @media (max-width: 480px) { .password-card { padding: 24px; } .password-field { flex-direction: column; } }
  </style>
</head>
<body><div class="site-shell"><nav class="top-nav"><a class="brand" href="/"><span class="brand-mark"><i class="fa-solid fa-link"></i></span><span>Wafy<span class="brand-accent">URL</span></span></a><a class="nav-cta" href="/">Visit WafyURL</a></nav>
  <main class="password-layout"><section class="password-card"><div class="password-lock"><i class="fa-solid fa-lock"></i></div><span class="eyebrow">PROTECTED DESTINATION</span><h1>Password required</h1><p>This short link has an access password. Enter it below to continue to the destination.</p><form id="passwordForm"><label class="field-label" for="passwordInput">Link password</label><div class="password-field"><input type="password" id="passwordInput" placeholder="Enter password" autocomplete="current-password" required><button id="unlockBtn" class="button button-primary" type="submit"><i class="fa-solid fa-unlock-keyhole"></i> Unlock</button></div><p id="passwordError" class="password-error" role="alert" aria-live="polite"></p></form></section></main>
  <footer class="site-footer"><div class="footer-bottom"><span>© 2026 WafyURL</span><span>Links made easier to share.</span></div></footer></div>
  <script>
    const form = document.getElementById('passwordForm');
    const passwordInput = document.getElementById('passwordInput');
    const unlockBtn = document.getElementById('unlockBtn');
    const errorEl = document.getElementById('passwordError');
    form.addEventListener('submit', async function(event) {
      event.preventDefault();
      const password = passwordInput.value;
      if (!password) { errorEl.textContent = 'Enter the link password to continue.'; return; }
      unlockBtn.disabled = true;
      unlockBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Checking';
      errorEl.textContent = '';
      try {
        const response = await fetch('/verify-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: window.location.pathname.split('/').pop(), password }) });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.error || 'Could not verify the password.');
        window.location.assign(data.url);
      } catch (error) {
        errorEl.textContent = error.message || 'Network error. Please try again.';
        unlockBtn.disabled = false;
        unlockBtn.innerHTML = '<i class="fa-solid fa-unlock-keyhole"></i> Unlock';
      }
    });
  </script>
</body>
</html>

  <style>
    .password-layout { display: grid; place-items: center; min-height: calc(100vh - 170px); padding: 40px 16px; }
    .password-card { width: min(440px, 100%); padding: 34px; border: 1px solid var(--border); border-radius: 18px; background: #fff; box-shadow: var(--shadow-card); }
    .password-lock { display: grid; place-items: center; width: 50px; height: 50px; margin-bottom: 20px; border-radius: 15px; background: var(--indigo-soft); color: var(--indigo); font-size: 19px; }
    .password-card h1 { margin: 0; font-size: 25px; letter-spacing: -.8px; }
    .password-card > p { margin: 9px 0 23px; color: var(--muted); font-size: 12px; line-height: 1.8; }
    .password-field { display: flex; gap: 8px; }
    .password-field input { width: 100%; min-width: 0; height: 45px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 10px; outline: 0; }
    .password-field input:focus { border-color: #818cf8; box-shadow: var(--focus); }
    .password-field button { flex: 0 0 auto; }
    .password-error { min-height: 22px; margin: 8px 0 0; color: var(--danger); font-size: 11px; }
    @media (max-width: 480px) { .password-card { padding: 24px; } .password-field { flex-direction: column; } }
  </style>

  <style id="critical-rendering">
    :root{color-scheme:light;--bg:#f6f5ef;--surface:#fff;--text:#202722;--text-soft:#56645b;--muted:#6b776e;--border:#e0e3d9;--border-strong:#cbd3c7;--indigo:#285943;--indigo-dark:#1e4634;--indigo-soft:#e8efe8;--radius:16px;--shadow-card:0 18px 48px rgba(31,48,36,.08)}
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:90px}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}button,a{-webkit-tap-highlight-color:transparent}
    .site-shell{min-height:100vh}.page-width{width:min(1120px,calc(100% - 48px));margin-inline:auto}
    .top-nav{width:min(1240px,calc(100% - 48px));min-height:78px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:28px;border-bottom:1px solid rgba(226,232,240,.78)}
    .brand{display:inline-flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-.7px;white-space:nowrap}
    .brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;color:#fff;background:linear-gradient(145deg,#397457,#234b37);font-size:14px}
    .brand-accent{color:var(--indigo)}.nav-links{display:flex;align-items:center;gap:30px;color:#536178;font-size:13px;font-weight:600}
    .nav-cta{display:inline-flex;align-items:center;gap:10px;padding:10px 15px;color:#fff;background:var(--indigo);border-radius:10px;font-size:12px;font-weight:700}
    .hero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center;gap:64px;padding-top:58px;padding-bottom:42px}
    .hero-home{display:block;text-align:center;max-width:900px;padding-top:56px;padding-bottom:38px}
    .hero-copy{padding:10px 0 24px}.section-kicker{display:flex;align-items:center;gap:9px;color:#4f46e5;font-size:10px;line-height:1.4;letter-spacing:1.45px;font-weight:800}
    .hero-home .section-kicker{justify-content:center}.kicker-dot{width:7px;height:7px;background:#397457;border-radius:50%;flex:0 0 auto}
    .hero h1{margin:22px 0 18px;max-width:100%;font-size:clamp(42px,5.2vw,66px);line-height:1.07;letter-spacing:-3.5px;font-weight:800}
    .hero-home h1{margin:18px auto 16px}.hero h1 span{color:var(--indigo)}
    .hero-description{max-width:560px;margin:0 auto;color:var(--text-soft);font-size:16px;line-height:1.85}
    .hero-proof{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 18px;margin-top:22px;color:#526176;font-size:11px;font-weight:600}
    .hero-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:25px}
    .button{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 17px;border:1px solid transparent;border-radius:10px;font-size:12px;font-weight:700}
    .button-primary{color:#fff;background:var(--indigo)}.button-secondary{color:var(--text);background:#fff;border-color:var(--border)}
    .shortener-section{padding:22px 0 58px}.shortener-section-intro{text-align:center;margin:0 auto 22px;max-width:650px}
    .shortener-section-intro .section-kicker{justify-content:center}.shortener-section-intro h2{margin:10px 0 6px;font-size:clamp(25px,3vw,34px);line-height:1.2;letter-spacing:-1px}
    .shortener-section-intro p{margin:0;color:var(--text-soft);line-height:1.8}
    .shortener-card{padding:29px;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-card)}
    .card-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px}
    .card-heading h2{margin:3px 0 0;font-size:21px;letter-spacing:-.6px;line-height:1.35}
    .eyebrow{display:block;color:#818da3;font-size:9px;letter-spacing:1.3px;font-weight:800}
    .site-footer{margin-top:48px;border-top:1px solid var(--border);background:rgba(255,255,255,.55)}
    .footer-main,.footer-bottom{width:min(1120px,calc(100% - 48px));margin:auto}
    .footer-main{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;padding:28px 0}
    .footer-main p{max-width:440px;color:var(--muted);font-size:12px}.footer-links{display:flex;flex-wrap:wrap;gap:18px;font-size:12px}
    .footer-bottom{display:flex;justify-content:space-between;gap:12px;padding:16px 0;border-top:1px solid var(--border);color:var(--muted);font-size:11px}
    .faq-page,.seo-page,.analytics-page{width:min(900px,calc(100% - 48px));margin:38px auto 70px}
    .faq-page-heading{padding:30px 0 20px}.faq-page-heading h1,.seo-page h1{font-size:clamp(32px,5vw,48px);line-height:1.15;letter-spacing:-1.8px}
    .faq-page-heading p,.seo-page .lead{color:var(--text-soft);line-height:1.85}
    .password-layout{display:grid;place-items:center;min-height:calc(100vh - 170px);padding:40px 16px}
    .password-card{width:min(440px,100%);padding:34px;border:1px solid var(--border);border-radius:18px;background:#fff;box-shadow:var(--shadow-card)}
    @media(max-width:700px){.top-nav{width:calc(100% - 32px);min-height:68px;gap:12px}.nav-links{gap:12px;font-size:11px}.nav-cta{padding:9px 10px;font-size:11px}.brand{font-size:17px}.brand-mark{width:30px;height:30px}.page-width{width:calc(100% - 32px)}.hero-home{padding-top:42px;padding-bottom:28px}.hero h1{font-size:clamp(38px,10vw,54px);letter-spacing:-2px}.hero-description{font-size:14px}.shortener-card{padding:20px}.footer-main,.footer-bottom{width:calc(100% - 32px)}.footer-main{align-items:flex-start;flex-direction:column}.footer-bottom{flex-wrap:wrap}.faq-page,.seo-page,.analytics-page{width:calc(100% - 32px)}}
    @media(max-width:420px){.nav-links{gap:9px}.nav-links a:nth-child(2){display:none}.nav-cta{font-size:10px}.hero-actions .button{width:100%}.password-card{padding:24px}}

<body><div class="site-shell"><nav class="top-nav"><a class="brand" href="/"><span class="brand-mark"><i class="fa-solid fa-link"></i></span><span>Wafy<span class="brand-accent">URL</span></span></a><a class="nav-cta" href="/">Visit WafyURL</a></nav>
  <main class="password-layout"><section class="password-card"><div class="password-lock"><i class="fa-solid fa-lock"></i></div><span class="eyebrow">PROTECTED DESTINATION</span><h1>Password required</h1><p>This short link has an access password. Enter it below to continue to the destination.</p><form id="passwordForm"><label class="field-label" for="passwordInput">Link password</label><div class="password-field"><input type="password" id="passwordInput" placeholder="Enter password" autocomplete="current-password" required><button id="unlockBtn" class="button button-primary" type="submit"><i class="fa-solid fa-unlock-keyhole"></i> Unlock</button></div><p id="passwordError" class="password-error" role="alert" aria-live="polite"></p></form></section></main>
  <footer class="site-footer"><div class="footer-bottom"><span>© 2026 WafyURL</span><span>Links made easier to share.</span></div></footer></div>
  <script>
    const form = document.getElementById('passwordForm');
    const passwordInput = document.getElementById('passwordInput');
    const unlockBtn = document.getElementById('unlockBtn');
    const errorEl = document.getElementById('passwordError');
    form.addEventListener('submit', async function(event) {
      event.preventDefault();
      const password = passwordInput.value;
      if (!password) { errorEl.textContent = 'Enter the link password to continue.'; return; }
      unlockBtn.disabled = true;
      unlockBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Checking';
      errorEl.textContent = '';
      try {
        const response = await fetch('/verify-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: window.location.pathname.split('/').pop(), password }) });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.error || 'Could not verify the password.');
        window.location.assign(data.url);
      } catch (error) {
        errorEl.textContent = error.message || 'Network error. Please try again.';
        unlockBtn.disabled = false;
        unlockBtn.innerHTML = '<i class="fa-solid fa-unlock-keyhole"></i> Unlock';
      }
    });
  </script>
</body>
</html>

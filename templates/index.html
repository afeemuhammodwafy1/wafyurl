<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WafyURL - Link Management</title>
    <link rel="icon" href="/icon.webp" type="image/webp">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <div class="header">
        <svg class="header-icon" viewBox="0 0 24 24">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <h1>WafyURL</h1>
    </div>
    <p class="subtitle">Fast, lightweight, and secure link management</p>

    {% if error %}
    <div class="alert-error">
        <svg class="error-icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ error }}</span>
    </div>
    {% endif %}

    <form id="shorten-form">
        <div class="form-group">
            <label for="url">
                <svg class="label-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
                Destination URL *
            </label>
            <input type="url" id="url" placeholder="https://example.com/long-path" required>
        </div>

        <div class="form-group">
            <label for="custom_code">
                <svg class="label-icon" viewBox="0 0 24 24">
                    <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                    <line x1="7" y1="7" x2="7.01" y2="7"></line>
                </svg>
                Custom Alias (Optional)
            </label>
            <input type="text" id="custom_code" placeholder="custom-link">
        </div>

        <div class="form-group">
            <label for="expires_in">
                <svg class="label-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                Expiration
            </label>
            <select id="expires_in">
                <option value="never">Never</option>
                <option value="1h">1 Hour</option>
                <option value="24h">24 Hours</option>
                <option value="7d">7 Days</option>
            </select>
        </div>

        <div class="form-group">
            <label for="password">
                <svg class="label-icon" viewBox="0 0 24 24">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Password Protection (Optional)
            </label>
            <input type="password" id="password" placeholder="Leave empty for public access">
        </div>

        <button type="submit" id="submit-btn">
            <svg class="btn-icon" viewBox="0 0 24 24">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
            <span id="btn-text">Shorten URL</span>
        </button>
    </form>

    <div id="result" class="result-box">
        <div class="result-header">
            <svg class="label-icon" viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Shortened Link
        </div>
        <a id="short-link" href="#" target="_blank"></a>
    </div>

    <div class="stats-text">
        <svg class="stats-icon" viewBox="0 0 24 24">
            <path d="M18 20V10"></path>
            <path d="M12 20V4"></path>
            <path d="M6 20v-6"></path>
        </svg>
        Total Links Created: {{ total_links }}
    </div>
</div>

<script>
document.getElementById('shorten-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    btnText.innerText = 'Processing...';
    btn.disabled = true;

    const payload = {
        url: document.getElementById('url').value,
        custom_code: document.getElementById('custom_code').value,
        expires_in: document.getElementById('expires_in').value,
        password: document.getElementById('password').value
    };

    try {
        const res = await fetch('/shorten', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        
        const resultDiv = document.getElementById('result');
        const linkElem = document.getElementById('short-link');

        if (data.success) {
            linkElem.href = data.short_url;
            linkElem.innerText = data.short_url;
            resultDiv.style.display = 'block';
        } else {
            alert(data.error || 'Failed to generate link');
        }
    } catch (err) {
        alert('Internal server error');
    } finally {
        btnText.innerText = 'Shorten URL';
        btn.disabled = false;
    }
});
</script>

</body>
</html>
